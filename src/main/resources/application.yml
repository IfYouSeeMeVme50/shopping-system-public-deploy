spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopping_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    # 修改为自己的数据库密码
    password: Qwe235354744
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      # 启动时初始化数据库，update模式会保留数据
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # 静态资源配置
  resources:
    static-locations: classpath:/static/,classpath:/public/,file:./uploads/

  # Jackson日期序列化配置
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

logging:
  file:
    name: run.log
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: error

# 文件上传路径
file:
  upload-dir: uploads/

app:
  auto-clean: false
  # 控制是否初始化数据，默认为false
  initialize-data: true