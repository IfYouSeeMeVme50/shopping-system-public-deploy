services:
  mysql:
    image: mysql:8.0
    container_name: shopping-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Qwe235354744
      MYSQL_DATABASE: shopping_system
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../src/main/java/com/example/shopping_system/配置文件和数据库/database.sql:/docker-entrypoint-initdb.d/database.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
      start_period: 30s
      interval: 10s
    networks:
      - shopping-network

  app:
    build: .
    container_name: shopping-app
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - shopping-network

volumes:
  mysql_data:
  uploads_data:

networks:
  shopping-network:
    driver: bridge
